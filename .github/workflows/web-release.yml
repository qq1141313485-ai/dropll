name: Web Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build web --release --base-href /web/
      - uses: actions/upload-artifact@v4
        with:
          name: qiu-jing-web-release
          path: build/web
          if-no-files-found: error
          retention-days: 14
