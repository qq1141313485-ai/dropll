<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="球镜足球赛事数据与资料工具">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="球镜">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>球镜</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="loading" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:16px system-ui;color:#667085;background:#fff">
    正在加载球镜…
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('loading')?.remove();
    });
    navigator.serviceWorker?.getRegistrations().then(function (registrations) {
      return Promise.all(
        registrations
          .filter(function (registration) {
            return new URL(registration.scope).pathname.startsWith('/web/');
          })
          .map(function (registration) { return registration.unregister(); })
      );
    });
  </script>
  <script src="flutter_bootstrap.js" async
          onerror="document.getElementById('loading').textContent='加载失败，请刷新页面重试'"></script>
</body>
</html>
